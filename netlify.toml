[build]
publish = "."

# a area de membros mudou de dominio: manda os links antigos pro lugar certo
[[redirects]]
from = "/membroessencial/*"
to = "https://crescer-em-paz-membros.netlify.app/membroessencial/:splat"
status = 301
force = true

[[redirects]]
from = "/membrocompleta/*"
to = "https://crescer-em-paz-membros.netlify.app/membrocompleta/:splat"
status = 301
force = true

[[redirects]]
from = "/membrocompleto/*"
to = "https://crescer-em-paz-membros.netlify.app/membrocompleta/:splat"
status = 301
force = true

[[redirects]]
from = "/membros/*"
to = "https://crescer-em-paz-membros.netlify.app/:splat"
status = 301
force = true
